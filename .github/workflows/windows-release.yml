name: Windows installer packages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Configure
        run: cmake --preset windows-x64 "-DFOLDERNOTE_UPDATE_REPOSITORY=$env:GITHUB_REPOSITORY" -DFOLDERNOTE_LEGACY_TRANSPORT_ONLY=ON
      - name: Build
        run: cmake --build --preset release --parallel
      - name: Validate release version
        if: github.ref_type == 'tag'
        run: |
          $version = (Get-Item build/Release/FolderNote.exe).VersionInfo.ProductVersion
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Git tag must match product version v$version."
          }
      - name: Test
        run: ctest --preset release --timeout 120 --repeat until-pass:3
      - name: Package installers
        run: .\packaging\build-release.ps1 -StableNames
      - name: Prepare release notes
        run: |
          $version = (Get-Item build/Release/FolderNote.exe).VersionInfo.ProductVersion
          $log = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $section = [regex]::Match($log, '(?ms)^## ' + [regex]::Escape($version) + ' [^\r\n]+\r?\n(.*?)(?=^## |\z)')
          if (!$section.Success) { throw "Missing changelog for $version." }
          $intro = "下载 **FolderNote-Setup-x64.exe** 即可安装，无需解压。Win11 首层菜单测试版请下载 **FolderNote-Setup-Win11-x64.exe**。安装包使用软件图标，可从 Windows 已安装的应用中卸载；覆盖升级保留用户设置和数据。`n`nZIP 用于兼容旧版在线更新。`n`n"
          ($intro + $section.Groups[1].Value.Trim()) | Set-Content dist/ReleaseNotes.md -Encoding utf8
      - name: Collect debug symbols
        run: |
          $pdbs = 'FolderNote', 'FolderNoteShell', 'FolderNoteNavigation' | ForEach-Object { "build/Release/$_.pdb" } | Where-Object { Test-Path $_ }
          if (!$pdbs) { throw "No release PDBs were produced." }
          Compress-Archive -Path $pdbs -DestinationPath dist/FolderNote-symbols-x64.zip -Force
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: FolderNote-windows-x64
          path: |
            dist/FolderNote-Setup-x64.exe
            dist/FolderNote-Setup-Win11-x64.exe
            dist/FolderNote-win-x64.zip
            dist/FolderNote-win11-test.zip
            dist/SHA256SUMS.txt
            dist/ReleaseNotes.md
            dist/FolderNote-symbols-x64.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: windows-release-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: FolderNote-windows-x64
          path: packages
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $repo = $env:GITHUB_REPOSITORY
          $assets = 'packages/FolderNote-Setup-x64.exe', 'packages/FolderNote-Setup-Win11-x64.exe', 'packages/FolderNote-win-x64.zip', 'packages/FolderNote-win11-test.zip', 'packages/SHA256SUMS.txt', 'packages/FolderNote-symbols-x64.zip'
          $existing = gh release view $tag --repo $repo --json isDraft 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --verify-tag --title "FolderNote $tag" --notes-file packages/ReleaseNotes.md --draft
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } elseif (-not ($existing | ConvertFrom-Json).isDraft) {
            Write-Host "Release $tag is already published."
            exit 0
          }
          gh release upload $tag --repo $repo --clobber @assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --repo $repo --draft=false --latest
