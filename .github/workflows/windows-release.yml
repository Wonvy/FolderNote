name: Windows installer packages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Configure
        run: cmake --preset windows-x64 "-DFOLDERNOTE_UPDATE_REPOSITORY=$env:GITHUB_REPOSITORY" -DFOLDERNOTE_LEGACY_TRANSPORT_ONLY=ON
      - name: Build
        run: cmake --build --preset release --parallel
      - name: Validate release version
        if: github.ref_type == 'tag'
        run: |
          $version = (Get-Item build/Release/FolderNote.exe).VersionInfo.ProductVersion
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Git tag must match product version v$version."
          }
      - name: Test
        run: ctest --preset release --timeout 120 --repeat until-pass:3
      - name: Package installers
        run: .\packaging\build-release.ps1 -StableNames
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: FolderNote-windows-x64
          path: |
            dist/FolderNote-win-x64.zip
            dist/FolderNote-win11-test.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: windows-release-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: FolderNote-windows-x64
          path: packages
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $repo = $env:GITHUB_REPOSITORY
          $assets = 'packages/FolderNote-win-x64.zip', 'packages/FolderNote-win11-test.zip', 'packages/SHA256SUMS.txt'
          $existing = gh release view $tag --repo $repo --json isDraft 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --verify-tag --generate-notes --draft
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } elseif (-not ($existing | ConvertFrom-Json).isDraft) {
            Write-Host "Release $tag is already published."
            exit 0
          }
          gh release upload $tag --repo $repo --clobber @assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --repo $repo --draft=false
