    <path d="M173 289 l4 4 4-4" fill="none" stroke="#516071" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="20" y="321" width="176" height="34" rx="4" fill="#ffffff" stroke="#d7dfe9"/>
    <text x="108" y="343" font-size="14" font-weight="400" fill="#202a38" text-anchor="middle">Export language template</text>
    <rect x="20" y="365" width="176" height="34" rx="4" fill="#ffffff" stroke="#d7dfe9"/>
    <text x="108" y="387" font-size="14" font-weight="400" fill="#202a38" text-anchor="middle">Import language file</text>
    <text x="20" y="525" font-size="14" font-weight="400" fill="#516071" text-anchor="start">Version 1.9.2 · x64</text>
    <rect x="20" y="540" width="176" height="34" rx="4" fill="#ffffff" stroke="#d7dfe9"/>
    <text x="108" y="562" font-size="14" font-weight="400" fill="#202a38" text-anchor="middle">Check for Updates</text>
    <text x="237" y="89" font-size="25" font-weight="650" fill="#202a38" text-anchor="start">Features</text>
    <text x="776" y="68" font-size="14" font-weight="400" fill="#516071" text-anchor="start">Appearance</text>
    <rect x="776" y="78" width="180" height="34" rx="4" fill="#ffffff" stroke="#d7dfe9"/>
