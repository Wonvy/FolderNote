    <text x="28" y="209" font-size="15" font-weight="400" fill="#202a38" text-anchor="start">Pinned and History</text>
    <text x="20" y="263" font-size="14" font-weight="400" fill="#516071" text-anchor="start">Language</text>
    <rect x="20" y="275" width="176" height="34" rx="4" fill="#ffffff" stroke="#d7dfe9"/>
