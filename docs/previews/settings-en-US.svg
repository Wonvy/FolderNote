<svg xmlns="http://www.w3.org/2000/svg" width="980" height="592" viewBox="0 0 980 592" role="img" aria-labelledby="title" lang="en-US">
  <title id="title">FolderNote Settings</title>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
    <rect x="0.5" y="0.5" width="979" height="591" rx="9" fill="#f4f6f9" stroke="#d7dfe9"/>
