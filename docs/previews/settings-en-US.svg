    <text x="20" y="114" font-size="14" font-weight="400" fill="#516071" text-anchor="start">System Tools</text>
    <rect x="12" y="139" width="190" height="40" rx="5" fill="#e7f0fe" stroke="none"/>
    <rect x="12" y="149" width="3" height="20" rx="1" fill="#1769d1" stroke="none"/>
