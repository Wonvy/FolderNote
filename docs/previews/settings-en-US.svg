    <text x="283" y="164" font-size="15" font-weight="600" fill="#202a38" text-anchor="start">Folder Notes</text>
    <text x="283" y="190" font-size="14" font-weight="400" fill="#516071" text-anchor="start">Add, edit, clear, and repair notes from a folder’s context menu.</text>
    <rect x="237" y="226" width="719" height="111" rx="8" fill="#ffffff" stroke="#d7dfe9"/>
    <rect x="257" y="244" width="16" height="16" rx="3" fill="#1769d1" stroke="#1769d1"/>
    <path d="M261 252 l3 3 5-6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
