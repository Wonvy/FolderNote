    <rect x="283" y="270" width="384" height="34" rx="4" fill="#ffffff" stroke="#d7dfe9"/>
    <text x="295" y="292" font-size="14" font-weight="400" fill="#202a38" text-anchor="start">Go up one level</text>
    <path d="M644 284 l4 4 4-4" fill="none" stroke="#516071" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="283" y="323" font-size="14" font-weight="400" fill="#516071" text-anchor="start">Double-click empty space in the File Explorer file list.</text>
    <rect x="237" y="348" width="719" height="153" rx="8" fill="#ffffff" stroke="#d7dfe9"/>
    <rect x="257" y="366" width="16" height="16" rx="3" fill="#1769d1" stroke="#1769d1"/>
    <path d="M261 374 l3 3 5-6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="283" y="379" font-size="15" font-weight="600" fill="#202a38" text-anchor="start">Middle-click Folder Menu</text>
    <rect x="283" y="392" width="16" height="16" rx="3" fill="#1769d1" stroke="#1769d1"/>
    <path d="M287 400 l3 3 5-6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="309" y="405" font-size="15" font-weight="600" fill="#202a38" text-anchor="start">Also support file and folder selection dialogs</text>
    <text x="283" y="431" font-size="14" font-weight="400" fill="#516071" text-anchor="start">Open pinned, recent, or frequent folders. Hover to browse subfolders.</text>
    <rect x="283" y="446" width="179" height="34" rx="4" fill="#ffffff" stroke="#d7dfe9"/>
    <text x="372.5" y="468" font-size="14" font-weight="400" fill="#202a38" text-anchor="middle">Pinned and History →</text>
    <rect x="237" y="540" width="158" height="34" rx="4" fill="#ffffff" stroke="#d7dfe9"/>
    <text x="316" y="562" font-size="14" font-weight="400" fill="#202a38" text-anchor="middle">Copy Diagnostics</text>
    <rect x="770" y="540" width="86" height="34" rx="4" fill="#1769d1" stroke="#1769d1"/>
    <text x="813" y="562" font-size="14" font-weight="400" fill="#ffffff" text-anchor="middle">Save</text>
    <rect x="870" y="540" width="86" height="34" rx="4" fill="#ffffff" stroke="#d7dfe9"/>
    <text x="913" y="562" font-size="14" font-weight="400" fill="#202a38" text-anchor="middle">Cancel</text>
